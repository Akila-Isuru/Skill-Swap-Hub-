<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SkillSwap Hub | Dashboard</title>

    <script>

        (function() {
            const token = localStorage.getItem('token');
            const userId = localStorage.getItem('userId');
            if (!token || token === "null" || !userId || userId === "null" || userId === "undefined") {
                window.location.replace("pages/login.html"); // replace() - back button block
            }
        })();
    </script>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --sidebar-bg: #1e293b;
            --main-bg: #f8fafc;
            --accent: #3b82f6;
            --card-bg: #ffffff;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --border-color: #e2e8f0;
        }
        * { box-sizing: border-box; }
        body {
            font-family: 'Inter', sans-serif;
            background: var(--main-bg);
            margin: 0;
            display: flex;
            color: var(--text-main);
        }
        .sidebar {
            width: 280px;
            background: var(--sidebar-bg);
            height: 100vh;
            position: fixed;
            padding: 30px 20px;
            display: flex;
            flex-direction: column;
        }
        .sidebar h2 { color: white; margin-bottom: 40px; display: flex; align-items: center; gap: 10px; }
        .nav-link { display: flex; align-items: center; color: #94a3b8; padding: 12px 15px; text-decoration: none; border-radius: 10px; transition: 0.2s; cursor: pointer; }
        .nav-link:hover, .nav-link.active { background: var(--accent); color: white; }
        .logout-btn { color: #f87171 !important; margin-top: auto; }
        .main-content { flex: 1; margin-left: 280px; padding: 50px 60px; max-width: 1400px; }
        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 25px; }
        .stat-card { background: var(--card-bg); padding: 25px; border-radius: 16px; border: 1px solid var(--border-color); }
        .stat-card .value { font-size: 32px; font-weight: 700; margin-top: 15px; display: block; }
    </style>
</head>
<body>

<div class="sidebar">
    <h2><span>🚀</span> SkillSwap</h2>
    <div class="nav-menu">
        <a href="index.html" class="nav-link active"><span>🏠</span> Dashboard</a>
        <a href="pages/my-skills.html" class="nav-link"><span>📚</span> My Skills</a>
        <a href="pages/explore.html" class="nav-link"><span>🌍</span> Explore</a>
        <a href="pages/find-matches.html" class="nav-link"><span>🔍</span> Matches</a>
        <a href="pages/requests.html" class="nav-link"><span>📩</span> Requests</a>
        <a onclick="logout()" class="nav-link logout-btn"><span>🚪</span> Logout</a>
    </div>
</div>

<div class="main-content">
    <div class="header-section">
        <h1 id="welcome-msg">Welcome...</h1>
        <p id="user-bio">Your daily skill-swapping activity at a glance.</p>
    </div>

    <div class="stats-grid">
        <div class="stat-card"><h3>Avg. Rating</h3><span class="value" id="stat-rating">0.0</span></div>
        <div class="stat-card"><h3>Active Skills</h3><span class="value" id="stat-skills">0</span></div>
        <div class="stat-card"><h3>Pending Requests</h3><span class="value" id="stat-incoming">0</span></div>
        <div class="stat-card"><h3>Sent Requests</h3><span class="value" id="stat-outgoing">0</span></div>
    </div>
</div>

<script>
    const token = localStorage.getItem('token');
    const loggedInUserId = localStorage.getItem('userId');

    function loadUserSummary() {
        if (!token || !loggedInUserId) return;

        $.ajax({
            url: "http://localhost:8080/api/v1/user/summary/" + loggedInUserId,
            method: "GET",
            headers: { "Authorization": "Bearer " + token },
            success: function (res) {
                if (res.code === 200) {
                    const data = res.data;
                    $("#welcome-msg").text("Welcome back, " + data.userName + "!");
                    $("#user-bio").text(data.bio || "Keep swapping skills!");
                    $("#stat-rating").text(data.averageRating ? data.averageRating.toFixed(1) : "0.0");
                    $("#stat-skills").text(data.totalSkills || 0);
                    $("#stat-incoming").text(data.pendingIncomingRequests || 0);
                    $("#stat-outgoing").text(data.totalOutgoingRequests || 0);
                }
            },
            error: function(err) {
                console.error("Summary Load Failed:", err);
                if (err.status === 401 || err.status === 403) {
                    logout();
                }
            }
        });
    }

    function logout() {
        localStorage.clear();
        window.location.href = "pages/login.html";
    }

    $(document).ready(loadUserSummary);
</script>

</body>
</html>
