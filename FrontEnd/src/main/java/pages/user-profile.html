<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>User Profile | SkillSwap Hub</title>

  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,300;0,700;0,900;1,300;1,700&family=Cabinet+Grotesk:wght@400;500;700;800&display=swap" rel="stylesheet">

  <script>
    const token = localStorage.getItem('token');
    const loggedInUserId = localStorage.getItem('userId');
    if (!token || !loggedInUserId || loggedInUserId === "undefined") {
      window.location.replace("login.html");
    }
  </script>

  <style>
    :root {
      --white:   #ffffff;
      --off:     #f8f9fa;
      --off2:    #e9ecef;
      --ink:     #0e0d0b;
      --ink2:    #3d3b36;
      --ink3:    #6c757d;
      --accent:  #ff5c35;
      --accent2: #ffb347;
      --blue:    #3b6ef8;
      --green:   #1cb87e;
      --glass:   rgba(255, 255, 255, 0.7);
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Cabinet Grotesk', sans-serif;
      background: var(--off);
      color: var(--ink);
      padding: 40px 20px;
      min-height: 100vh;
      overflow-x: hidden;
    }

    .container {
      max-width: 800px;
      margin: 0 auto;
      perspective: 1500px;
    }

    .back-link {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      text-decoration: none;
      color: var(--ink3);
      font-weight: 700;
      font-size: 14px;
      margin-bottom: 30px;
      transition: 0.3s;
    }
    .back-link:hover { color: var(--accent); transform: translateX(-5px); }

    /* ---- 3D Glass Profile Card ---- */
    .profile-card {
      background: var(--glass);
      backdrop-filter: blur(15px);
      -webkit-backdrop-filter: blur(15px);
      border-radius: 32px;
      padding: 40px;
      border: 1px solid rgba(255, 255, 255, 0.8);
      box-shadow: 0 20px 60px rgba(0,0,0,0.05);
      margin-bottom: 30px;
      transform-style: preserve-3d;
      transition: transform 0.1s ease-out;
    }

    .profile-header {
      display: flex;
      align-items: center;
      gap: 24px;
      margin-bottom: 30px;
      transform: translateZ(30px);
    }

    .avatar {
      width: 90px; height: 90px;
      border-radius: 24px;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      display: flex; align-items: center; justify-content: center;
      font-size: 32px; color: white;
      font-family: 'Fraunces', serif; font-weight: 900;
      box-shadow: 0 10px 20px rgba(255, 92, 53, 0.2);
    }

    .profile-meta h2 {
      font-family: 'Fraunces', serif;
      font-size: 28px; font-weight: 900;
      margin-bottom: 4px;
    }
    .profile-meta .email { color: var(--ink3); font-size: 14px; margin-bottom: 10px; }
    .stars { color: #f59e0b; font-size: 18px; }

    .bio-section {
      background: rgba(255,255,255,0.5);
      border-radius: 20px;
      padding: 20px;
      font-size: 15px;
      line-height: 1.6;
      border: 1px solid rgba(0,0,0,0.03);
      color: var(--ink2);
      transform: translateZ(20px);
    }

    /* ---- Stats Grid ---- */
    .stats-row {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 15px;
      margin-top: 25px;
      transform: translateZ(25px);
    }
    .stat-box {
      background: white;
      padding: 15px;
      border-radius: 18px;
      text-align: center;
      border: 1px solid var(--off2);
      transition: 0.3s;
    }
    .stat-box:hover { transform: translateY(-5px); border-color: var(--accent); }
    .stat-box .val { font-family: 'Fraunces', serif; font-size: 24px; font-weight: 900; color: var(--accent); display: block; }
    .stat-box .lbl { font-size: 10px; font-weight: 800; color: var(--ink3); text-transform: uppercase; margin-top: 4px; }

    /* ---- Skills Section ---- */
    .section-card {
      background: white;
      border-radius: 28px;
      padding: 32px;
      border: 1px solid var(--off2);
      box-shadow: 0 10px 30px rgba(0,0,0,0.02);
    }
    .section-title {
      font-family: 'Fraunces', serif;
      font-size: 20px; font-weight: 900;
      margin-bottom: 20px;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--off2);
    }

    .skill-group-label {
      font-size: 11px; font-weight: 800;
      text-transform: uppercase; letter-spacing: 1px;
      margin: 20px 0 12px 0;
      display: flex; align-items: center; gap: 8px;
    }
    .skill-group-label.teach { color: var(--green); }
    .skill-group-label.learn { color: var(--blue); }

    .skills-wrap { display: flex; flex-wrap: wrap; gap: 10px; }
    .skill-pill {
      padding: 8px 18px;
      border-radius: 100px;
      font-size: 13px; font-weight: 700;
      display: inline-flex; align-items: center; gap: 8px;
      transition: 0.3s;
    }
    .skill-pill.teach { background: #e8f7f0; color: #0a5d3c; border: 1px solid #c3e6d5; }
    .skill-pill.learn { background: #eef2ff; color: #1e40af; border: 1px solid #dbe4ff; }
    .skill-pill:hover { transform: scale(1.05); }
    .skill-pill .level { font-size: 10px; opacity: 0.6; font-weight: 500; }

    /* ---- Swap Button ---- */
    .btn-swap {
      width: 100%;
      background: var(--ink);
      color: white;
      border: none;
      padding: 18px;
      border-radius: 20px;
      font-size: 16px; font-weight: 800;
      cursor: pointer;
      margin-top: 25px;
      transition: 0.3s;
      display: flex; align-items: center; justify-content: center; gap: 10px;
    }
    .btn-swap:hover { background: var(--accent); transform: translateY(-3px); box-shadow: 0 10px 20px rgba(255, 92, 53, 0.2); }

    .loading-state { text-align: center; padding: 100px; color: var(--ink3); font-weight: 700; }

    /* Animation */
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }
    #profile-content { animation: fadeUp 0.6s ease forwards; display: none; }
  </style>
</head>
<body>

<div class="container">
  <a href="javascript:history.back()" class="back-link">← Go Back</a>

  <div id="loading-state" class="loading-state">✨ Preparing Profile...</div>

  <div id="profile-content">
    <div class="profile-card" id="tilt-card">
      <div class="profile-header">
        <div class="avatar" id="avatar-initials">?</div>
        <div class="profile-meta">
          <h2 id="user-name">—</h2>
          <p class="email" id="user-email">—</p>
          <div>
            <span class="stars" id="star-display">☆☆☆☆☆</span>
            <span style="font-size: 13px; font-weight: 700; color: var(--ink3); margin-left: 8px;" id="rating-text">No ratings</span>
          </div>
        </div>
      </div>

      <div class="bio-section" id="user-bio">...</div>

      <div class="stats-row">
        <div class="stat-box">
          <span class="val" id="stat-rating">0.0</span>
          <span class="lbl">Rating</span>
        </div>
        <div class="stat-box">
          <span class="val" id="stat-skills">0</span>
          <span class="lbl">Total</span>
        </div>
        <div class="stat-box">
          <span class="val" id="stat-teach">0</span>
          <span class="lbl">Teach</span>
        </div>
        <div class="stat-box">
          <span class="val" id="stat-learn">0</span>
          <span class="lbl">Learn</span>
        </div>
      </div>
    </div>

    <div class="section-card">
      <div class="section-title">Expertise & Interests</div>
      <div id="skills-container"></div>
    </div>

    <button class="btn-swap" id="btn-send-request" onclick="goToMatches()" style="display:none">
      🔄 Start a Swap Request
    </button>
  </div>
</div>

<script>
  const urlParams = new URLSearchParams(window.location.search);
  const viewUserId = urlParams.get('userId');

  function loadUserSummary() {
    $.ajax({
      url: "http://localhost:8080/api/v1/user/summary/" + viewUserId,
      method: "GET",
      headers: { "Authorization": "Bearer " + token },
      success: function(res) {
        if (res.code === 200 && res.data) {
          const d = res.data;
          const initials = d.userName ? d.userName.split(' ').map(w => w[0]).join('').toUpperCase().slice(0,2) : '?';

          $("#avatar-initials").text(initials);
          $("#user-name").text(d.userName || "Anonymous");
          $("#user-email").text(d.email || "");
          $("#user-bio").text(d.bio || "This user prefers to keep their bio a mystery ✨");

          const rating = d.averageRating || 0;
          $("#stat-rating").text(rating.toFixed(1));
          $("#rating-text").text(rating > 0 ? rating.toFixed(1) + " / 5.0" : "No ratings yet");
          renderStars(rating);
        }
      }
    });
  }

  function loadSkills() {
    $.ajax({
      url: "http://localhost:8080/api/v1/user-skill/user/" + viewUserId,
      method: "GET",
      headers: { "Authorization": "Bearer " + token },
      success: function(res) {
        const container = $("#skills-container").empty();
        const data = res.data || [];

        const teach = data.filter(s => s.type === 'TEACH');
        const learn = data.filter(s => s.type === 'LEARN');

        $("#stat-teach").text(teach.length);
        $("#stat-learn").text(learn.length);
        $("#stat-skills").text(data.length);

        if (teach.length > 0) {
          container.append('<div class="skill-group-label teach"><span>✅</span> Mastered Skills</div>');
          const wrap = $('<div class="skills-wrap"></div>');
          teach.forEach(s => wrap.append(`<span class="skill-pill teach">${s.skillName} <span class="level">${s.expertiseLevel || ''}</span></span>`));
          container.append(wrap);
        }

        if (learn.length > 0) {
          container.append('<div class="skill-group-label learn"><span>📘</span> Looking to Learn</div>');
          const wrap = $('<div class="skills-wrap"></div>');
          learn.forEach(s => wrap.append(`<span class="skill-pill learn">${s.skillName} <span class="level">${s.expertiseLevel || ''}</span></span>`));
          container.append(wrap);
        }

        if (String(viewUserId) !== String(loggedInUserId)) $("#btn-send-request").show();

        $("#loading-state").hide();
        $("#profile-content").show();
      }
    });
  }

  function renderStars(rating) {
    const full = Math.floor(rating);
    const half = rating - full >= 0.5 ? 1 : 0;
    const empty = 5 - full - half;
    $("#star-display").text('⭐'.repeat(full) + (half ? '✨' : '') + '☆'.repeat(empty));
  }

  function goToMatches() { window.location.href = "find-matches.html"; }

  // 3D Tilt Logic
  const card = document.getElementById('tilt-card');
  document.addEventListener('mousemove', (e) => {
    const xAxis = (window.innerWidth / 2 - e.pageX) / 40;
    const yAxis = (window.innerHeight / 2 - e.pageY) / 40;
    card.style.transform = `rotateY(${xAxis}deg) rotateX(${yAxis}deg)`;
  });

  $(document).ready(function() {
    if (viewUserId) { loadUserSummary(); loadSkills(); }
  });
</script>

</body>
</html>
