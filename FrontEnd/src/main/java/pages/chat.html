<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chat - SkillSwap Hub</title>
  <script src="https://code.jquery.com/jquery-3.6.4.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/sockjs-client/1.5.0/sockjs.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/stomp.js/2.3.3/stomp.min.js"></script>
  <script>
    const token = localStorage.getItem('token');
    const loggedInUserId = localStorage.getItem('userId');
    if (!token || !loggedInUserId || loggedInUserId === "undefined") {
      window.location.replace("login.html");
    }
    const urlParams = new URLSearchParams(window.location.search);
    let receiverId = urlParams.get('receiverId');
  </script>
  <style>
    * { box-sizing: border-box; }
    body { font-family: 'Segoe UI', sans-serif; background: #f4f7f6; color: #1e293b; margin: 0; display: flex; flex-direction: column; height: 100vh; }
    .back-link { display: inline-block; text-decoration: none; color: #3b82f6; font-weight: 500; padding: 20px; font-size: 15px; }
    .chat-wrapper { flex: 1; max-width: 800px; width: 100%; margin: 0 auto 20px auto; background: white; border-radius: 16px; box-shadow: 0 4px 15px rgba(0,0,0,0.07); border: 1px solid #e2e8f0; display: flex; flex-direction: column; overflow: hidden; }
    .chat-header { padding: 20px 32px; border-bottom: 1px solid #f1f5f9; display: flex; align-items: center; gap: 15px; background: #fff; }
    .avatar { width: 45px; height: 45px; border-radius: 50%; background: linear-gradient(135deg, #3b82f6, #8b5cf6); display: flex; align-items: center; justify-content: center; font-size: 18px; color: white; font-weight: 700; }
    .chat-header h2 { margin: 0; font-size: 1.2rem; color: #0f172a; }
    .status-dot { width: 10px; height: 10px; background: #10b981; border-radius: 50%; margin-left: auto; }
    #message-area { flex: 1; padding: 32px; overflow-y: auto; background: #f8fafc; display: flex; flex-direction: column; gap: 12px; }
    .message { max-width: 70%; padding: 12px 18px; font-size: 15px; border-radius: 12px; }
    .sent { align-self: flex-end; background: #3b82f6; color: white; border-bottom-right-radius: 2px; }
    .received { align-self: flex-start; background: white; color: #1e293b; border: 1px solid #e2e8f0; border-bottom-left-radius: 2px; }
    .chat-input-row { padding: 20px 32px; background: white; display: flex; gap: 12px; border-top: 1px solid #f1f5f9; }
    #message-input { flex: 1; padding: 14px 18px; border-radius: 10px; border: 1px solid #e2e8f0; background: #f8fafc; outline: none; }
    .btn-send { background: #3b82f6; color: white; border: none; padding: 0 24px; border-radius: 10px; font-weight: 600; cursor: pointer; }
  </style>
</head>
<body>
<a href="javascript:history.back()" class="back-link">← Back</a>
<div class="chat-wrapper">
  <div class="chat-header">
    <div class="avatar" id="receiver-avatar">?</div>
    <div><h2 id="receiver-name">Loading...</h2><small style="color: #64748b;">Active Now</small></div>
    <div class="status-dot"></div>
  </div>
  <div id="message-area"></div>
  <div class="chat-input-row">
    <input type="text" id="message-input" placeholder="Type your message...">
    <button class="btn-send" id="send-btn">Send</button>
  </div>
</div>
<script>
  let stompClient = null;

  function connect() {
    const socket = new SockJS('http://localhost:8080/ws');
    stompClient = Stomp.over(socket);
    stompClient.connect({}, function (frame) {
      stompClient.subscribe('/user/' + loggedInUserId + '/queue/messages', function (message) {
        showMessage(JSON.parse(message.body).content, 'received');
      });
    });
  }

  // ✅ පරණ මැසේජ් ලෝඩ් කරන function එක
  function loadChatHistory() {
    $.ajax({
      url: `http://localhost:8080/api/v1/chat/history/${loggedInUserId}/${receiverId}`,
      method: "GET",
      headers: { "Authorization": "Bearer " + token },
      success: function(res) {
        if (res.data) {
          $("#message-area").empty();
          res.data.forEach(msg => {
            // මැසේජ් එක එවපු කෙනා ලොග් වෙලා ඉන්න කෙනා නම් 'sent', නැත්නම් 'received'
            const type = (msg.senderId == loggedInUserId) ? 'sent' : 'received';
            showMessage(msg.content, type);
          });
        }
      },
      error: function(err) {
        console.error("History load failed:", err);
      }
    });
  }

  function sendMessage() {
    const content = $("#message-input").val().trim();
    if (content && stompClient) {
      // ✅ මෙතන senderId සහ receiverId එක අපි DTO එකට ගැලපෙන විදියට යවනවා
      const chatMessage = {
        senderId: parseInt(loggedInUserId),
        receiverId: parseInt(receiverId),
        content: content
      };

      stompClient.send("/app/chat.sendMessage", {}, JSON.stringify(chatMessage));
      showMessage(content, 'sent');
      $("#message-input").val("");
    }
  }

  function showMessage(content, type) {
    $("#message-area").append(`<div class="message ${type}">${content}</div>`);
    const area = document.getElementById("message-area");
    area.scrollTop = area.scrollHeight;
  }

  $(document).ready(function() {
    connect();

    // ✅ පේජ් එක රෙඩි වූ ගමන් හිස්ට්‍රිය ලෝඩ් කරනවා
    if (receiverId) {
      loadChatHistory();

      $.ajax({
        url: "http://localhost:8080/api/v1/user/" + receiverId,
        method: "GET",
        headers: { "Authorization": "Bearer " + token },
        success: function(res) {
          $("#receiver-name").text(res.data.name);
          $("#receiver-avatar").text(res.data.name.charAt(0).toUpperCase());
        }
      });
    }

    $("#send-btn").click(sendMessage);
    $('#message-input').keypress(function(e) { if(e.which == 13) sendMessage(); });
  });
</script>
</body>
</html>
