<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Explore - SkillSwap Hub</title>
  <script src="https://code.jquery.com/jquery-3.6.4.min.js"></script>
  <script>
    const token = localStorage.getItem('token');
    const loggedInUserId = localStorage.getItem('userId');
    if (!token) window.location.replace("login.html");
  </script>
  <style>
    * { box-sizing: border-box; }
    body { font-family: 'Inter', 'Segoe UI', sans-serif; background: #f4f7f6; padding: 20px; color: #1e293b; margin: 0; }

    .back-link { text-decoration: none; color: #3b82f6; font-weight: 500; display: inline-block; margin-bottom: 20px; }

    .page-header { text-align: center; margin-bottom: 28px; }
    .page-header h2 { font-size: 28px; margin: 0 0 6px 0; }
    .page-header p  { color: #64748b; margin: 0; font-size: 15px; }

    /* ---- Toggle tabs ---- */
    .view-toggle {
      display: flex;
      justify-content: center;
      gap: 0;
      margin-bottom: 28px;
    }
    .toggle-btn {
      padding: 10px 32px;
      border: 2px solid #3b82f6;
      background: white;
      color: #3b82f6;
      font-weight: 600;
      font-size: 14px;
      cursor: pointer;
      transition: 0.2s;
    }
    .toggle-btn:first-child { border-radius: 8px 0 0 8px; border-right: 1px solid #3b82f6; }
    .toggle-btn:last-child  { border-radius: 0 8px 8px 0; border-left: 1px solid #3b82f6; }
    .toggle-btn.active { background: #3b82f6; color: white; }
    .toggle-btn:hover:not(.active) { background: #eff6ff; }

    /* ---- Search bar ---- */
    .search-wrap {
      max-width: 560px;
      margin: 0 auto 28px auto;
      position: relative;
    }
    .search-wrap input {
      width: 100%;
      padding: 14px 20px 14px 46px;
      border-radius: 12px;
      border: 1px solid #e2e8f0;
      font-size: 15px;
      outline: none;
      transition: 0.3s;
      background: white;
    }
    .search-wrap input:focus { border-color: #3b82f6; box-shadow: 0 0 0 3px rgba(59,130,246,0.1); }
    .search-icon {
      position: absolute;
      left: 16px;
      top: 50%;
      transform: translateY(-50%);
      color: #94a3b8;
      font-size: 18px;
      pointer-events: none;
    }

    /* ---- Skills grid ---- */
    .skill-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 20px;
      max-width: 1100px;
      margin: auto;
    }
    .skill-card {
      background: white;
      padding: 24px 20px;
      border-radius: 14px;
      text-align: center;
      box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05);
      border: 1px solid #e2e8f0;
      transition: 0.25s;
    }
    .skill-card:hover { transform: translateY(-4px); box-shadow: 0 10px 15px -3px rgba(0,0,0,0.1); }
    .skill-card h3 { margin: 0 0 14px 0; color: #0f172a; font-size: 16px; }
    .btn-find {
      background: #3b82f6;
      color: white;
      border: none;
      padding: 10px 18px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
      width: 100%;
      font-size: 14px;
      transition: 0.2s;
    }
    .btn-find:hover { background: #2563eb; }

    /* ---- People grid ---- */
    .people-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 20px;
      max-width: 1100px;
      margin: auto;
    }
    .people-card {
      background: white;
      padding: 24px 20px;
      border-radius: 14px;
      box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05);
      border: 1px solid #e2e8f0;
      transition: 0.25s;
    }
    .people-card:hover { transform: translateY(-4px); box-shadow: 0 10px 15px -3px rgba(0,0,0,0.1); }

    .people-card-top {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-bottom: 14px;
    }
    .avatar {
      width: 52px;
      height: 52px;
      border-radius: 50%;
      background: linear-gradient(135deg, #3b82f6, #8b5cf6);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      color: white;
      font-weight: 700;
      flex-shrink: 0;
    }

    /* Clickable name */
    .user-name-link {
      font-size: 16px;
      font-weight: 700;
      color: #0f172a;
      text-decoration: none;
      border-bottom: 2px solid #3b82f6;
      padding-bottom: 1px;
      transition: 0.2s;
      line-height: 1.3;
      display: inline-block;
    }
    .user-name-link:hover { color: #3b82f6; }

    .user-bio-preview {
      font-size: 13px;
      color: #64748b;
      margin: 2px 0 0 0;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    /* Teach skill pills in people card */
    .teach-pills { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 14px; min-height: 26px; }
    .teach-pill {
      background: #ecfdf5;
      color: #065f46;
      border: 1px solid #a7f3d0;
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 600;
    }
    .no-skills-label { font-size: 12px; color: #94a3b8; font-style: italic; }

    .btn-view-profile {
      width: 100%;
      background: #f8fafc;
      color: #3b82f6;
      border: 1px solid #bfdbfe;
      padding: 9px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
      font-size: 14px;
      transition: 0.2s;
      text-align: center;
      text-decoration: none;
      display: block;
    }
    .btn-view-profile:hover { background: #eff6ff; }

    .empty-state { grid-column: 1/-1; text-align: center; padding: 50px; color: #64748b; background: white; border-radius: 14px; }
  </style>
</head>
<body>

<a href="../index.html" class="back-link">← Back to Dashboard</a>

<div class="page-header">
  <h2>🌍 Explore</h2>
  <p>Discover skills and people in the SkillSwap community</p>
</div>

<!-- Skills / People toggle -->
<div class="view-toggle">
  <button class="toggle-btn active" id="btn-skills" onclick="switchView('skills')">📚 Skills</button>
  <button class="toggle-btn" id="btn-people" onclick="switchView('people')">👥 People</button>
</div>

<!-- Search -->
<div class="search-wrap">
  <span class="search-icon">🔍</span>
  <input type="text" id="explore-search" placeholder="Search..." oninput="onSearch()">
</div>

<!-- Content area -->
<div id="content-area"></div>

<script>
  let currentView   = 'skills';
  let allSkills     = [];
  let allPeople     = [];  // { userId, userName, bio, teachSkills: [] }

  // ============================================================
  // View switch
  // ============================================================
  function switchView(view) {
    currentView = view;
    $("#btn-skills, #btn-people").removeClass("active");
    $("#btn-" + view).addClass("active");
    $("#explore-search").val("");
    $("#explore-search").attr("placeholder", view === 'skills' ? "Search skills..." : "Search people or skills...");

    if (view === 'skills') {
      renderSkills(allSkills);
    } else {
      if (allPeople.length === 0) loadPeople();
      else renderPeople(allPeople);
    }
  }

  // ============================================================
  // Search handler
  // ============================================================
  function onSearch() {
    const kw = $("#explore-search").val().trim().toLowerCase();

    if (currentView === 'skills') {
      if (kw.length === 0) { renderSkills(allSkills); return; }
      if (kw.length >= 2) {
        $.ajax({
          url: "http://localhost:8080/api/v1/skill/search?keyword=" + kw,
          method: "GET",
          headers: { "Authorization": "Bearer " + token },
          success: function(res) { renderSkills(res.data || []); }
        });
      }
    } else {
      // Filter people locally by name or any teach skill
      if (kw.length === 0) { renderPeople(allPeople); return; }
      const filtered = allPeople.filter(p =>
              p.userName.toLowerCase().includes(kw) ||
              p.teachSkills.some(s => s.skillName.toLowerCase().includes(kw))
      );
      renderPeople(filtered);
    }
  }

  // ============================================================
  // Skills view
  // ============================================================
  function loadSkills() {
    $.ajax({
      url: "http://localhost:8080/api/v1/skill/all",
      method: "GET",
      headers: { "Authorization": "Bearer " + token },
      success: function(res) {
        allSkills = res.data || [];
        renderSkills(allSkills);
      },
      error: function(err) {
        if (err.status === 401) window.location.replace("login.html");
      }
    });
  }

  function renderSkills(skills) {
    const area = $("#content-area").empty();
    const grid = $('<div class="skill-grid"></div>');

    if (!skills || skills.length === 0) {
      grid.append('<div class="empty-state">No skills found.</div>');
    } else {
      skills.forEach(s => {
        grid.append(`
          <div class="skill-card">
            <h3>${s.skillName}</h3>
            <button class="btn-find"
              onclick="window.location.href='find-matches.html?skill=${s.id}'">
              Find Partners
            </button>
          </div>
        `);
      });
    }
    area.append(grid);
  }

  // ============================================================
  // People view
  // ============================================================
  function loadPeople() {
    $("#content-area").html('<div style="text-align:center;padding:40px;color:#94a3b8;">Loading people...</div>');

    // Get all users, then get their teach skills
    $.ajax({
      url: "http://localhost:8080/api/v1/user/all",
      method: "GET",
      headers: { "Authorization": "Bearer " + token },
      success: function(res) {
        const users = (res.data || []).filter(u => String(u.id) !== String(loggedInUserId));

        if (users.length === 0) {
          renderPeople([]);
          return;
        }

        // For each user fetch their teach skills
        // Use Promise-style with $.ajax to collect all
        let loaded = 0;
        const people = [];

        users.forEach(u => {
          $.ajax({
            url: "http://localhost:8080/api/v1/user-skill/user/" + u.id,
            method: "GET",
            headers: { "Authorization": "Bearer " + token },
            success: function(skillRes) {
              const teachSkills = (skillRes.data || []).filter(s => s.type === 'TEACH');
              people.push({
                userId:      u.id,
                userName:    u.name,
                bio:         u.bio || "",
                teachSkills: teachSkills
              });
            },
            error: function() {
              // Still add user even if skills fail
              people.push({ userId: u.id, userName: u.name, bio: u.bio || "", teachSkills: [] });
            },
            complete: function() {
              loaded++;
              if (loaded === users.length) {
                // Sort by number of teach skills desc
                people.sort((a, b) => b.teachSkills.length - a.teachSkills.length);
                allPeople = people;
                renderPeople(allPeople);
              }
            }
          });
        });
      },
      error: function(err) {
        if (err.status === 401) window.location.replace("login.html");
      }
    });
  }

  function renderPeople(people) {
    const area = $("#content-area").empty();
    const grid = $('<div class="people-grid"></div>');

    if (!people || people.length === 0) {
      grid.append('<div class="empty-state">No people found.</div>');
      area.append(grid);
      return;
    }

    people.forEach(p => {
      // Avatar initials
      const initials = p.userName
              .split(' ').map(w => w[0]).join('').toUpperCase().slice(0, 2);

      // Teach skills pills (max 4 shown)
      let pillsHtml = '';
      if (p.teachSkills.length === 0) {
        pillsHtml = '<span class="no-skills-label">No teaching skills listed</span>';
      } else {
        const shown = p.teachSkills.slice(0, 4);
        pillsHtml = shown.map(s => `<span class="teach-pill">${s.skillName}</span>`).join('');
        if (p.teachSkills.length > 4) {
          pillsHtml += `<span class="teach-pill" style="background:#f1f5f9;color:#64748b;border-color:#e2e8f0;">+${p.teachSkills.length - 4} more</span>`;
        }
      }

      const bioText = p.bio ? p.bio : 'No bio provided.';

      grid.append(`
        <div class="people-card">
          <div class="people-card-top">
            <div class="avatar">${initials}</div>
            <div>
              <a class="user-name-link"
                 href="user-profile.html?userId=${p.userId}"
                 title="View ${p.userName}'s profile">${p.userName}</a>
              <p class="user-bio-preview">${bioText}</p>
            </div>
          </div>

          <div class="teach-pills">${pillsHtml}</div>

          <a class="btn-view-profile" href="user-profile.html?userId=${p.userId}">
            View Full Profile →
          </a>
        </div>
      `);
    });

    area.append(grid);
  }

  // ============================================================
  // Init
  // ============================================================
  $(document).ready(function() {
    loadSkills();
  });
</script>
</body>
</html>
