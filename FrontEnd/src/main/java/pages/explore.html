<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Explore Skills - SkillSwap Hub</title>
  <script src="https://code.jquery.com/jquery-3.6.4.min.js"></script>
  <script>

    const token = localStorage.getItem('token');
    if (!token) {
      window.location.replace("login.html");
    }
  </script>
  <style>
    body { font-family: 'Inter', 'Segoe UI', sans-serif; background: #f4f7f6; padding: 20px; color: #1e293b; }
    .search-bar { max-width: 600px; margin: 30px auto; display: flex; gap: 10px; }
    .search-bar input { flex: 1; padding: 14px; border-radius: 10px; border: 1px solid #e2e8f0; font-size: 16px; outline: none; transition: 0.3s; }
    .search-bar input:focus { border-color: #3b82f6; box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1); }

    .skill-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 25px; max-width: 1100px; margin: auto; }
    .skill-card { background: white; padding: 25px; border-radius: 15px; text-align: center; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05); border: 1px solid #e2e8f0; transition: 0.3s; }
    .skill-card:hover { transform: translateY(-5px); box-shadow: 0 10px 15px -3px rgba(0,0,0,0.1); }
    .skill-card h3 { margin: 0; color: #0f172a; font-size: 18px; }

    .btn-view { margin-top: 15px; background: #3b82f6; color: white; border: none; padding: 10px 20px; border-radius: 8px; cursor: pointer; font-weight: 600; width: 100%; transition: 0.2s; }
    .btn-view:hover { background: #2563eb; }
    .back-link { text-decoration: none; color: #3b82f6; font-weight: 500; display: inline-block; margin-bottom: 20px; }
  </style>
</head>
<body>

<div style="max-width: 1100px; margin: auto;">
  <a href="../index.html" class="back-link">← Back to Dashboard</a>
  <h2 style="text-align: center; font-size: 28px;">🌍 Explore All Skills</h2>

  <div class="search-bar">
    <input type="text" id="explore-search" placeholder="Search for a skill (e.g. Java, Photography)..." oninput="searchExplore()">
  </div>

  <div class="skill-grid" id="all-skills-grid">
  </div>
</div>

<script>

  function loadAllSkills() {
    $.ajax({
      url: "http://localhost:8080/api/v1/skill/all",
      method: "GET",
      headers: { "Authorization": "Bearer " + token },
      success: function(res) {
        displaySkills(res.data);
      },
      error: function(err) {
        console.error("Failed to load skills:", err);
        if(err.status === 401) window.location.replace("login.html");
      }
    });
  }


  function searchExplore() {
    let kw = $("#explore-search").val();
    if(kw.length > 0) {
      $.ajax({
        url: "http://localhost:8080/api/v1/skill/search?keyword=" + kw,
        method: "GET",
        headers: { "Authorization": "Bearer " + token },
        success: function(res) {
          displaySkills(res.data);
        }
      });
    } else {
      loadAllSkills();
    }
  }

  function displaySkills(skills) {
    const grid = $("#all-skills-grid");
    grid.empty();

    if(!skills || skills.length === 0) {
      grid.append("<p style='grid-column: 1/-1; text-align: center; color: #64748b;'>No skills found matching your search.</p>");
      return;
    }

    skills.forEach(s => {
      grid.append(`
                <div class="skill-card">
                    <h3>${s.skillName}</h3>
                    <button class="btn-view" onclick="location.href='find-matches.html?skill=${s.id}'">Find Partners</button>
                </div>
            `);
    });
  }

  $(document).ready(loadAllSkills);
</script>
</body>
</html>
