<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Explore Skills - SkillSwap Hub</title>
  <style>
    body { font-family: 'Segoe UI', sans-serif; background: #f4f7f6; padding: 20px; }
    .search-bar { max-width: 600px; margin: 20px auto; display: flex; gap: 10px; }
    .search-bar input { flex: 1; padding: 12px; border-radius: 8px; border: 1px solid #ddd; font-size: 16px; }
    .skill-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 20px; max-width: 1000px; margin: auto; }
    .skill-card { background: white; padding: 20px; border-radius: 12px; text-align: center; box-shadow: 0 4px 10px rgba(0,0,0,0.05); transition: 0.3s; }
    .skill-card:hover { transform: translateY(-5px); box-shadow: 0 8px 20px rgba(0,0,0,0.1); }
    .skill-card h3 { margin: 0; color: #2c3e50; }
    .btn-view { margin-top: 10px; background: #3498db; color: white; border: none; padding: 8px 15px; border-radius: 5px; cursor: pointer; }
  </style>
</head>
<body>

<h2 style="text-align: center;">🌍 Explore All Skills</h2>

<div class="search-bar">
  <input type="text" id="explore-search" placeholder="Search for a skill (e.g. Java, UI/UX)..." oninput="searchExplore()">
</div>

<div class="skill-grid" id="all-skills-grid">
</div>

<script src="https://code.jquery.com/jquery-3.6.4.min.js"></script>
<script>
  function loadAllSkills() {
    $.get("http://localhost:8080/api/v1/skill/all", function(res) {
      displaySkills(res.data);
    });
  }

  function searchExplore() {
    let kw = $("#explore-search").val();
    if(kw.length > 0) {
      $.get("http://localhost:8080/api/v1/skill/search?keyword=" + kw, function(res) {
        displaySkills(res.data);
      });
    } else {
      loadAllSkills();
    }
  }

  function displaySkills(skills) {
    const grid = $("#all-skills-grid");
    grid.empty();
    skills.forEach(s => {
      grid.append(`
                <div class="skill-card">
                    <h3>${s.skillName}</h3>
                    <button class="btn-view" onclick="location.href='find-matches.html?skill=${s.id}'">Find Partners</button>
                </div>
            `);
    });
  }

  $(document).ready(loadAllSkills);
</script>
</body>
</html>
