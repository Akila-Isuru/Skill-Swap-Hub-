<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Find Matches - SkillSwap Hub</title>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script>
        const token = localStorage.getItem('token');
        const loggedInUserId = localStorage.getItem('userId');

        if (!token || !loggedInUserId || loggedInUserId === "undefined") {
            window.location.replace("login.html");
        }
    </script>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #f4f7f6; padding: 20px; }
        .match-card { background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); margin-bottom: 15px; display: flex; justify-content: space-between; align-items: center; transition: 0.2s; border: 1px solid #eef2f7; }
        .match-card:hover { transform: translateY(-3px); box-shadow: 0 6px 15px rgba(0,0,0,0.1); }
        .user-info h3 { margin: 0; color: #1e293b; font-size: 1.2rem; }
        .user-info p { margin: 10px 0; color: #64748b; font-size: 14px; }
        .skill-tag { background: #3b82f6; color: white; padding: 6px 14px; border-radius: 20px; font-size: 13px; font-weight: 600; }
        .btn-request { background: #f59e0b; color: white; border: none; padding: 12px 22px; border-radius: 8px; cursor: pointer; font-weight: bold; transition: 0.3s; }
        .btn-request:hover { background: #d97706; }
        .back-link { margin-bottom: 20px; display: inline-block; text-decoration: none; color: #3b82f6; font-weight: 500; }
        .no-matches { text-align: center; padding: 40px; color: #64748b; background: white; border-radius: 12px; }
    </style>
</head>
<body>

<a href="../index.html" class="back-link">← Back to Dashboard</a>

<h2>Potential Skill Swappers</h2>
<p style="color: #64748b;">ඔබ ඉගෙන ගැනීමට කැමති දේ ඉගැන්වීමට හැකි පුද්ගලයින් මෙහි දැක්වේ.</p>

<div id="matches-container">
</div>

<script>
    function loadMatches() {
        $.ajax({
            url: "http://localhost:8080/api/v1/user-skill/matches/" + loggedInUserId,
            method: "GET",
            headers: { "Authorization": "Bearer " + token },
            success: function(res) {
                const container = $("#matches-container").empty();

                if(!res.data || res.data.length === 0) {
                    container.append(`
                        <div class="no-matches">
                            <p>No matches found yet. Try adding more skills to your <strong>'Learn'</strong> list in My Skills!</p>
                        </div>
                    `);
                    return;
                }

                res.data.forEach(m => {
                    container.append(`
                        <div class="match-card">
                            <div class="user-info">
                                <h3>${m.userName}</h3>
                                <p>Can teach you: <span class="skill-tag">${m.skillName}</span></p>
                            </div>
                            <button class="btn-request" onclick="sendSwapRequest(${m.userId}, ${m.skillId}, '${m.skillName}', '${m.userName}')">
                                Send Swap Request
                            </button>
                        </div>
                    `);
                });
            },
            error: function(err) {
                if (err.status === 401) {
                    localStorage.clear();
                    window.location.replace("login.html");
                }
                console.error("Match load failed:", err);
            }
        });
    }

    // මචං මේ function එක විතරයි තියෙන්න ඕනේ
    function sendSwapRequest(toUserId, skillId, skillName, toUserName) {
        console.log("Attempting to send request to:", toUserId);

        const requestData = {
            senderId: parseInt(loggedInUserId),
            receiverId: parseInt(toUserId),
            message: "I want to swap skills with you for " + skillName,
            status: "PENDING"
        };

        $.ajax({
            url: "http://localhost:8080/api/v1/swap/send",
            method: "POST",
            headers: {
                "Authorization": "Bearer " + token,
                "Content-Type": "application/json"
            },
            data: JSON.stringify(requestData),
            success: function(res) {
                alert(`Success! Swap request sent to ${toUserName} for '${skillName}'.`);
            },
            error: function(err) {
                console.error("Swap request failed:", err);
                alert("Failed to send swap request. Check console for details.");
            }
        });
    }

    $(document).ready(function() {
        loadMatches();
    });
</script>
</body>
</html>
