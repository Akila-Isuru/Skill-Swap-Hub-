<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Matches | SkillSwap Hub</title>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,300;0,700;0,900;1,300&family=Cabinet+Grotesk:wght@400;500;700;800&display=swap" rel="stylesheet">

    <script>
        const token = localStorage.getItem('token');
        const loggedInUserId = localStorage.getItem('userId');
        if (!token) window.location.replace("login.html");
    </script>

    <style>
        :root {
            --bg: #f7f6f2;
            --white: #ffffff;
            --off2: #eeecea;
            --ink: #0e0d0b;
            --ink2: #3d3b36;
            --ink3: #8a8780;
            --accent: #ff5c35;
            --accent-soft: rgba(255, 92, 53, 0.08);
            --border: rgba(0,0,0,0.06);
            --r: 20px;
        }

        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Cabinet Grotesk', sans-serif;
            background: var(--bg);
            color: var(--ink);
            min-height: 100vh;
            padding: 60px 24px;
            perspective: 1000px;
        }

        /* Subtle grid pattern background */
        body::before {
            content: '';
            position: fixed; inset: 0;
            background-image: radial-gradient(rgba(0,0,0,0.03) 1px, transparent 1px);
            background-size: 32px 32px;
            pointer-events: none;
            z-index: 0;
        }

        .container { width: 100%; max-width: 650px; margin: 0 auto; position: relative; z-index: 1; }

        .back-link {
            display: inline-flex; align-items: center; gap: 8px;
            color: var(--ink3); text-decoration: none;
            font-size: 14px; font-weight: 700;
            margin-bottom: 40px; transition: color .2s;
        }
        .back-link:hover { color: var(--accent); }

        .header { margin-bottom: 40px; text-align: left; }
        .header h1 {
            font-family: 'Fraunces', serif;
            font-size: 42px; font-weight: 900;
            letter-spacing: -1.5px;
        }
        .header h1 em { font-style: italic; font-weight: 300; color: var(--accent); }
        .header p { color: var(--ink3); font-size: 16px; font-weight: 500; margin-top: 8px; }

        .match-card {
            background: var(--white); border-radius: var(--r); padding: 32px;
            border: 1px solid var(--border); margin-bottom: 16px;
            display: flex; justify-content: space-between; align-items: center;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            transform-style: preserve-3d;
            animation: revealIn .5s ease both;
        }

        @keyframes revealIn {
            from { opacity: 0; transform: translateY(20px) rotateX(-5deg); }
            to { opacity: 1; transform: translateY(0) rotateX(0); }
        }

        .match-card:hover {
            transform: translateZ(20px) scale(1.02);
            box-shadow: 0 20px 40px rgba(0,0,0,0.06);
            border-color: var(--accent);
        }

        .user-info h3 {
            font-family: 'Fraunces', serif;
            font-size: 22px; font-weight: 800;
            margin-bottom: 8px; color: var(--ink);
        }

        .skill-tag-wrap { display: flex; align-items: center; gap: 10px; margin-top: 12px; }
        .skill-label { font-size: 13px; color: var(--ink3); font-weight: 600; }
        .skill-badge {
            background: var(--accent-soft); color: var(--accent); padding: 6px 14px;
            border-radius: 100px; font-size: 12px; font-weight: 800;
            border: 1px solid rgba(255, 92, 53, 0.1);
        }

        .btn-req {
            background: var(--ink); color: white; border: none; padding: 14px 28px;
            border-radius: 16px; font-weight: 700; cursor: pointer;
            transition: all 0.3s; font-family: inherit; font-size: 14px;
        }
        .btn-req:hover { background: var(--accent); transform: translateY(-3px); box-shadow: 0 10px 20px rgba(255, 92, 53, 0.2); }
        .btn-req:disabled { opacity: 0.5; cursor: not-allowed; transform: none !important; box-shadow: none !important; }

        .badge-mode {
            display: inline-flex; align-items: center; gap: 6px;
            background: #fff4f2; color: var(--accent); padding: 8px 16px;
            border-radius: 100px; font-size: 12px; font-weight: 800;
            margin-bottom: 24px; border: 1px solid rgba(255, 92, 53, 0.1);
            text-transform: uppercase; letter-spacing: 0.5px;
        }

        .loader-box {
            text-align: center; padding: 80px 24px;
            background: var(--white); border-radius: var(--r);
            border: 1px solid var(--border); color: var(--ink3);
        }
        .spinner {
            width: 32px; height: 32px; border: 3px solid var(--off2);
            border-top-color: var(--accent); border-radius: 50%;
            animation: spin .8s linear infinite; margin: 0 auto 20px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>

<div class="container">
    <a href="explore.html" class="back-link">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><polyline points="15 18 9 12 15 6"/></svg>
        Back to Explore
    </a>

    <div id="mode-area"></div>

    <div class="header">
        <h1 id="title">Skill <em>Matches</em></h1>
        <p>Connect with people who are experts in what you want to learn.</p>
    </div>

    <div id="match-list">
        <div class="loader-box">
            <div class="spinner"></div>
            <p>Finding the perfect matches for you...</p>
        </div>
    </div>
</div>

<script>
    const urlParams = new URLSearchParams(window.location.search);
    const skillId = urlParams.get('skill');

    function init() {
        if (skillId) {
            $("#mode-area").html('<div class="badge-mode"><span>✨</span> Specific Skill Search</div>');
            loadBySkill(skillId);
        } else {
            loadSmartMatches();
        }
    }

    function loadBySkill(id) {
        $.ajax({
            url: "http://localhost:8080/api/v1/user-skill/by-skill/" + id,
            method: "GET",
            headers: { "Authorization": "Bearer " + token },
            success: (res) => render(res.data)
        });
    }

    function loadSmartMatches() {
        $.ajax({
            url: "http://localhost:8080/api/v1/user-skill/matches/" + loggedInUserId,
            method: "GET",
            headers: { "Authorization": "Bearer " + token },
            success: (res) => render(res.data)
        });
    }

    function render(data) {
        const list = $("#match-list").empty();
        const filtered = (data || []).filter(m => String(m.userId) !== String(loggedInUserId));

        if (!filtered.length) {
            list.html('<div class="loader-box"><p>No matches found for this skill yet. Try another one!</p></div>');
            return;
        }

        filtered.forEach((m, i) => {
            list.append(`
        <div class="match-card" style="animation-delay:${i * 0.08}s">
          <div class="user-info">
            <h3>${m.userName}</h3>
            <div class="skill-tag-wrap">
              <span class="skill-label">Teaches:</span>
              <span class="skill-badge">${m.skillName}</span>
            </div>
          </div>
          <button class="btn-req" onclick="sendReq(this, ${m.userId}, ${m.skillId}, '${m.skillName}')">Swap Skills 🚀</button>
        </div>`);
        });
    }

    function sendReq(btn, toId, sId, sName) {
        const originalText = $(btn).text();
        $(btn).prop('disabled', true).text('Sending...');

        $.ajax({
            url: "http://localhost:8080/api/v1/swap/send",
            method: "POST",
            headers: { "Authorization": "Bearer " + token, "Content-Type": "application/json" },
            data: JSON.stringify({ senderId: loggedInUserId, receiverId: toId, message: "Hi! I'd like to swap skills for: " + sName, status: "PENDING" }),
            success: () => {
                $(btn).text('Request Sent! ✅').css({'background': '#22c55e', 'box-shadow': 'none'});
            },
            error: () => {
                alert("Failed to send request. Please try again.");
                $(btn).prop('disabled', false).text(originalText);
            }
        });
    }

    $(document).ready(init);
</script>
</body>
</html>
