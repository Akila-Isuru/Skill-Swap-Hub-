<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Profile — SkillSwap Hub</title>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,300;0,700;0,900;1,300&family=Cabinet+Grotesk:wght@400;500;700;800&display=swap" rel="stylesheet">
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script>
        const token = localStorage.getItem('token');
        const loggedInUserId = localStorage.getItem('userId');
        if (!token || !loggedInUserId || loggedInUserId === "undefined") window.location.replace("login.html");
    </script>
    <style>
        :root {
            --bg: #f7f6f2;
            --white: #ffffff;
            --off2: #eeecea;
            --ink: #0e0d0b;
            --ink2: #3d3b36;
            --ink3: #8a8780;
            --accent: #ff5c35;
            --accent2: #ffb347;
            --green: #10b981;
            --border: rgba(0,0,0,0.06);
            --r: 16px;
            --rl: 24px;
        }

        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Cabinet Grotesk', sans-serif;
            background: var(--bg);
            color: var(--ink);
            min-height: 100vh;
            padding: 60px 24px;
            display: flex;
            justify-content: center;
        }

        /* Subtle grid background */
        body::before {
            content: ''; position: fixed; inset: 0;
            background-image: radial-gradient(rgba(0,0,0,0.03) 1px, transparent 1px);
            background-size: 32px 32px; z-index: 0;
        }

        .wrap { width: 100%; max-width: 580px; position: relative; z-index: 1; }

        .back-link {
            display: inline-flex; align-items: center; gap: 8px;
            color: var(--ink3); text-decoration: none;
            font-size: 14px; font-weight: 700; margin-bottom: 40px;
            transition: all 0.2s ease;
        }
        .back-link:hover { color: var(--accent); transform: translateX(-4px); }

        h1 {
            font-family: 'Fraunces', serif;
            font-size: 36px; font-weight: 900; letter-spacing: -1.2px;
            margin-bottom: 32px; color: var(--ink);
        }

        /* Premium Profile Card */
        .card {
            background: var(--white);
            border: 1px solid var(--border);
            border-radius: var(--rl);
            padding: 40px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.03);
            animation: cardSlideUp 0.6s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @keyframes cardSlideUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .card-title {
            font-family: 'Fraunces', serif;
            font-size: 20px; font-weight: 800;
            margin-bottom: 30px; padding-bottom: 12px;
            border-bottom: 1px solid var(--off2);
            color: var(--ink);
        }

        .form-group { margin-bottom: 24px; }

        label {
            display: block; font-size: 11px; font-weight: 800;
            text-transform: uppercase; letter-spacing: 0.8px;
            color: var(--ink3); margin-bottom: 10px;
        }

        input, textarea {
            width: 100%; padding: 14px 18px; background: var(--bg);
            border: 1px solid var(--border); border-radius: var(--r);
            color: var(--ink); font-size: 15px; font-weight: 600;
            font-family: inherit; outline: none; transition: all 0.25s ease;
        }

        input:focus, textarea:focus {
            background: var(--white); border-color: var(--accent);
            box-shadow: 0 0 0 4px rgba(255, 92, 53, 0.08);
        }

        input.readonly {
            background: #f1f0ee; color: var(--ink3);
            cursor: not-allowed; border-style: dashed;
        }

        textarea { height: 130px; resize: vertical; line-height: 1.6; }

        .password-hint {
            font-size: 12px; font-weight: 500; text-transform: none;
            letter-spacing: 0; color: var(--ink3); margin-left: 4px;
        }

        .btn-update {
            width: 100%; background: var(--ink); color: var(--white);
            border: none; padding: 16px; border-radius: var(--r);
            font-family: inherit; font-size: 15px; font-weight: 800;
            cursor: pointer; transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            margin-top: 8px;
        }
        .btn-update:hover {
            background: var(--accent); transform: translateY(-3px);
            box-shadow: 0 10px 25px rgba(255, 92, 53, 0.2);
        }

        /* Success Toast - Floating Glass effect */
        .success-toast {
            position: fixed; top: 30px; left: 50%; transform: translateX(-50%);
            background: rgba(16, 185, 129, 0.95); backdrop-filter: blur(8px);
            color: white; border-radius: 100px; padding: 12px 28px;
            font-size: 14px; font-weight: 700; z-index: 1000;
            display: none; box-shadow: 0 15px 30px rgba(16, 185, 129, 0.25);
            border: 1px solid rgba(255,255,255,0.2);
        }
    </style>
</head>
<body>

<div id="success-toast" class="success-toast">Profile updated successfully! ✨</div>

<div class="wrap">
    <a href="../index.html" class="back-link">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><path d="M15 18l-6-6 6-6"/></svg>
        Dashboard
    </a>

    <h1>Profile Settings</h1>

    <div class="card">
        <div class="card-title">Personal Information</div>

        <div class="form-group">
            <label>Full Name</label>
            <input type="text" id="profile-name" placeholder="Akila Isuru">
        </div>

        <div class="form-group">
            <label>Email Address <span class="password-hint">(Read Only)</span></label>
            <input type="email" id="profile-email" class="readonly" readonly>
        </div>

        <div class="form-group">
            <label>About You (Bio)</label>
            <textarea id="profile-bio" placeholder="Write a short bio about your professional skills or hobbies..."></textarea>
        </div>

        <div class="form-group">
            <label>Update Password <span class="password-hint">(Optional)</span></label>
            <input type="password" id="profile-password" placeholder="••••••••">
        </div>

        <button class="btn-update" onclick="updateProfile()">Save Changes</button>
    </div>
</div>

<script>
    function loadProfileData() {
        $.ajax({
            url: "http://localhost:8080/api/v1/user/" + loggedInUserId,
            method: "GET", headers: { "Authorization": "Bearer " + token },
            success: function(res) {
                if (res.data) {
                    $("#profile-name").val(res.data.name);
                    $("#profile-email").val(res.data.email);
                    $("#profile-bio").val(res.data.bio || "");
                }
            },
            error: function(err) { if (err.status === 401) window.location.replace("login.html"); }
        });
    }

    function updateProfile() {
        const passwordValue = $("#profile-password").val();
        const updatedData = {
            id: parseInt(loggedInUserId),
            name: $("#profile-name").val(),
            email: $("#profile-email").val(),
            bio: $("#profile-bio").val(),
            password: passwordValue && passwordValue.trim() !== "" ? passwordValue : null
        };

        if (!updatedData.name) {
            alert("Please enter your name.");
            return;
        }

        $.ajax({
            url: "http://localhost:8080/api/v1/user",
            method: "PUT", headers: { "Authorization": "Bearer " + token },
            contentType: "application/json",
            data: JSON.stringify(updatedData),
            success: function() {
                localStorage.setItem('userName', updatedData.name);
                $("#success-toast").fadeIn(300).css('display','inline-block').delay(2500).fadeOut(400);
                $("#profile-password").val("");
            },
            error: function() { alert("Something went wrong. Please try again."); }
        });
    }

    $(document).ready(loadProfileData);
</script>
</body>
</html>
