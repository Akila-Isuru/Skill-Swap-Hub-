<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reviews & Ratings | SkillSwap Hub</title>

  <script>
    const token = localStorage.getItem('token');
    const loggedInUserId = localStorage.getItem('userId');
    if (!token || !loggedInUserId || loggedInUserId === "undefined") window.location.replace("login.html");
  </script>

  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,300;0,700;0,900;1,300&family=Cabinet+Grotesk:wght@400;500;700;800&display=swap" rel="stylesheet">

  <style>
    :root {
      --white:   #ffffff;
      --off:     #f7f6f2;
      --off2:    #eeecea;
      --off3:    #e5e3de;
      --ink:     #0e0d0b;
      --ink2:    #3d3b36;
      --ink3:    #8a8780;
      --ink4:    #bbb9b4;
      --accent:  #ff5c35;
      --accent2: #ffb347;
      --r: 14px;
      --rl: 20px;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Cabinet Grotesk', sans-serif;
      background: var(--off);
      color: var(--ink);
      min-height: 100vh;
      display: flex;
      justify-content: center; /* මැදට ගෙන ඒමට */
      padding: 60px 24px;
    }

    /* MAIN CONTENT WRAPPER */
    .container {
      width: 100%;
      max-width: 720px; /* මැද තියෙන කොටසේ පළල */
      position: relative;
    }

    .header-area { margin-bottom: 40px; }

    .back-link {
      display: inline-flex; align-items: center; gap: 6px;
      color: var(--ink3); text-decoration: none;
      font-size: 13px; font-weight: 700; margin-bottom: 16px;
      transition: color .2s;
    }
    .back-link:hover { color: var(--accent); }

    h1 {
      font-family: 'Fraunces', serif;
      font-size: clamp(28px, 5vw, 36px);
      font-weight: 900;
      letter-spacing: -1px;
      line-height: 1.1;
    }

    /* FORM CARD */
    .card {
      background: var(--white);
      border-radius: var(--rl);
      padding: 32px;
      border: 1px solid var(--off2);
      margin-bottom: 48px;
      box-shadow: 0 4px 24px rgba(0,0,0,0.03);
    }

    .card-title {
      font-family: 'Fraunces', serif;
      font-size: 19px; font-weight: 700;
      margin-bottom: 24px; color: var(--ink);
      border-bottom: 1px solid var(--off);
      padding-bottom: 12px;
    }

    .form-group { margin-bottom: 20px; }

    label {
      display: block; font-size: 11px; font-weight: 800;
      text-transform: uppercase; color: var(--ink3);
      margin-bottom: 8px; letter-spacing: .8px;
    }

    select, textarea {
      width: 100%; padding: 14px;
      background: var(--off);
      border: 1px solid var(--off2);
      border-radius: var(--r);
      font-family: inherit; font-size: 14px;
      outline: none; transition: all .2s;
    }

    select:focus, textarea:focus {
      border-color: var(--accent);
      background: var(--white);
      box-shadow: 0 0 0 4px rgba(255, 92, 53, 0.05);
    }

    textarea { height: 120px; resize: vertical; }

    /* STARS CUSTOM */
    .star-select { display: flex; flex-direction: row-reverse; justify-content: flex-end; gap: 6px; }
    .star-select input { display: none; }
    .star-select label { font-size: 32px; color: var(--off3); cursor: pointer; transition: .2s; }
    .star-select input:checked ~ label,
    .star-select label:hover,
    .star-select label:hover ~ label { color: var(--accent2); }

    .btn-submit {
      width: 100%; background: var(--ink); color: var(--white);
      border: none; padding: 16px; border-radius: var(--r);
      font-weight: 700; font-size: 15px; cursor: pointer; transition: .2s;
      margin-top: 10px;
    }
    .btn-submit:hover { background: var(--accent); transform: translateY(-2px); box-shadow: 0 8px 20px rgba(255, 92, 53, 0.2); }

    /* REVIEW LIST */
    .section-label {
      font-family: 'Fraunces', serif; font-size: 22px;
      font-weight: 700; margin-bottom: 24px;
      display: flex; align-items: center; gap: 10px;
    }

    .reviews-grid { display: grid; gap: 16px; }

    .review-card {
      background: var(--white); border: 1px solid var(--off2);
      border-radius: var(--r); padding: 24px;
      transition: transform .2s;
    }

    .review-card:hover { transform: translateY(-2px); border-color: var(--off3); }

    .review-top { display: flex; align-items: center; gap: 12px; margin-bottom: 14px; }

    .rev-avatar {
      width: 42px; height: 42px; border-radius: 12px;
      background: var(--off2); display: flex; align-items: center;
      justify-content: center; font-weight: 800; font-size: 14px;
      color: var(--ink2);
    }

    .rev-info p { font-size: 15px; font-weight: 700; }
    .rev-info span { font-size: 12px; color: var(--ink3); }

    .rev-stars { margin-left: auto; color: var(--accent2); font-size: 14px; letter-spacing: 1px; }

    .rev-comment {
      font-size: 14px; color: var(--ink2);
      line-height: 1.6; font-style: italic;
      padding: 14px; background: var(--off); border-radius: 10px;
      border-left: 3px solid var(--off3);
    }

    .spinner {
      width: 28px; height: 28px; border: 3px solid var(--off2);
      border-top-color: var(--accent); border-radius: 50%;
      animation: spin .8s linear infinite; margin: 40px auto;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .empty-state { text-align: center; color: var(--ink3); padding: 40px; font-size: 14px; }
  </style>
</head>
<body>

<div class="container">
  <div class="header-area">
    <a href="../index.html" class="back-link">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><polyline points="15 18 9 12 15 6"/></svg>
      Back to Dashboard
    </a>
    <h1>Reviews & Ratings</h1>
  </div>

  <div class="card">
    <div class="card-title">Rate a Swapper</div>

    <div class="form-group">
      <label>Select User</label>
      <select id="reviewee-id">
        <option value="">-- Choose a swapper --</option>
      </select>
    </div>

    <div class="form-group">
      <label>Your Rating</label>
      <div class="star-select">
        <input type="radio" id="s5" name="stars" value="5"><label for="s5">★</label>
        <input type="radio" id="s4" name="stars" value="4"><label for="s4">★</label>
        <input type="radio" id="s3" name="stars" value="3" checked><label for="s3">★</label>
        <input type="radio" id="s2" name="stars" value="2"><label for="s2">★</label>
        <input type="radio" id="s1" name="stars" value="1"><label for="s1">★</label>
      </div>
    </div>

    <div class="form-group">
      <label>Comment</label>
      <textarea id="review-comment" placeholder="How was your skill swapping experience with this person?"></textarea>
    </div>

    <button class="btn-submit" onclick="submitReview()">Submit Review ⭐</button>
  </div>

  <div class="section-label">Reviews You've Received</div>
  <div id="reviews-list" class="reviews-grid">
    <div class="spinner"></div>
  </div>
</div>

<script>
  // ලෝඩ් කරන ෆන්ක්ෂන් එක
  function loadUsers() {
    $.ajax({
      url: "http://localhost:8080/api/v1/user/all",
      method: "GET",
      headers: { "Authorization": "Bearer " + token },
      success: function(res) {
        const sel = $("#reviewee-id");
        (res.data || []).forEach(u => {
          if (String(u.id) !== String(loggedInUserId))
            sel.append(`<option value="${u.id}">${u.name}</option>`);
        });
      }
    });
  }

  function loadMyReviews() {
    $.ajax({
      url: "http://localhost:8080/api/v1/review/user/" + loggedInUserId,
      method: "GET",
      headers: { "Authorization": "Bearer " + token },
      success: function(res) {
        const list = $("#reviews-list").empty();
        if (!res.data || !res.data.length) {
          list.html('<div class="empty-state">No reviews yet. Start swapping to get feedback!</div>');
          return;
        }
        res.data.forEach(r => {
          const stars = '★'.repeat(r.rating) + '☆'.repeat(5 - r.rating);
          const initials = (r.reviewerName || 'A').split(' ').map(w=>w[0]).join('').toUpperCase().slice(0,2);
          list.append(`
            <div class="review-card">
                <div class="review-top">
                    <div class="rev-avatar">${initials}</div>
                    <div class="rev-info">
                        <p>${r.reviewerName || 'Anonymous'}</p>
                        <span>Verified User</span>
                    </div>
                    <div class="rev-stars">${stars}</div>
                </div>
                <div class="rev-comment">"${r.comment || 'No comment provided.'}"</div>
            </div>`);
        });
      },
      error: function() {
        $("#reviews-list").html('<div class="empty-state">Failed to load reviews.</div>');
      }
    });
  }

  function submitReview() {
    const revieweeId = $("#reviewee-id").val();
    const comment = $("#review-comment").val().trim();
    const rating = parseInt($("input[name='stars']:checked").val());

    if (!revieweeId) { alert("Please select a user!"); return; }
    if (!comment) { alert("Please add a comment!"); return; }

    $.ajax({
      url: "http://localhost:8080/api/v1/review",
      method: "POST",
      headers: { "Authorization": "Bearer " + token },
      contentType: "application/json",
      data: JSON.stringify({
        reviewerId: parseInt(loggedInUserId),
        revieweeId: parseInt(revieweeId),
        rating,
        comment
      }),
      success: function() {
        alert("✅ Review submitted successfully!");
        location.reload();
      },
      error: function() {
        alert("❌ Error submitting review.");
      }
    });
  }

  $(document).ready(function() {
    loadUsers();
    loadMyReviews();
  });
</script>
</body>
</html>
