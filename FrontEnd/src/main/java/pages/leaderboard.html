<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Leaderboard - SkillSwap Hub</title>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,300;0,700;0,900;1,300&family=Cabinet+Grotesk:wght@400;500;700;800&display=swap" rel="stylesheet">
  <script src="https://code.jquery.com/jquery-3.6.4.min.js"></script>
  <script>
    const token = localStorage.getItem('token');
    if (!token) window.location.replace("login.html");
  </script>
  <style>
    /* Light Theme Root Variables */
    :root {
      --bg: #f7f6f2; /* Off-white from dashboard */
      --white: #ffffff;
      --off2: #eeecea;
      --off3: #e5e3de;
      --ink: #0e0d0b;
      --ink2: #3d3b36;
      --ink3: #8a8780;
      --accent: #ff5c35;
      --accent2: #ffb347;
      --blue: #3b6ef8;
      --green: #1cb87e;
      --border: rgba(0,0,0,0.06);
      --rl: 24px;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Cabinet Grotesk', sans-serif;
      background: var(--bg);
      color: var(--ink);
      min-height: 100vh;
      padding: 60px 24px;
    }

    /* Subtle grid pattern for texture */
    body::before {
      content: '';
      position: fixed; inset: 0;
      background-image: radial-gradient(rgba(0,0,0,0.03) 1px, transparent 1px);
      background-size: 32px 32px;
      pointer-events: none;
      z-index: 0;
    }

    .wrap { max-width: 720px; margin: 0 auto; position: relative; z-index: 1; }

    .back-link {
      display: inline-flex; align-items: center; gap: 8px;
      color: var(--ink3); text-decoration: none;
      font-size: 14px; font-weight: 700;
      margin-bottom: 40px; transition: color .2s;
    }
    .back-link:hover { color: var(--accent); }

    .page-header { text-align: center; margin-bottom: 52px; }
    .page-header h1 {
      font-family: 'Fraunces', serif;
      font-size: clamp(32px, 6vw, 48px);
      font-weight: 900; letter-spacing: -1.5px; margin-bottom: 12px;
    }
    .page-header h1 em { font-style: italic; font-weight: 300; color: var(--accent); }
    .page-header p { color: var(--ink3); font-size: 16px; font-weight: 500; }

    /* Podium - Light Version */
    .podium { display: flex; align-items: flex-end; justify-content: center; gap: 16px; margin-bottom: 48px; }
    .podium-item { display: flex; flex-direction: column; align-items: center; gap: 12px; flex: 1; max-width: 180px; }

    .podium-avatar {
      border-radius: 50%; display: flex; align-items: center; justify-content: center;
      font-family: 'Fraunces', serif; font-weight: 900; color: white;
      box-shadow: 0 10px 25px rgba(0,0,0,0.1);
    }

    /* Gold/Silver/Bronze Styles */
    .podium-item:nth-child(1) .podium-avatar { width: 64px; height: 64px; font-size: 24px; background: linear-gradient(135deg, #d4af37, #f9e29c); }
    .podium-item:nth-child(2) .podium-avatar { width: 80px; height: 80px; font-size: 30px; background: linear-gradient(135deg, var(--accent), var(--accent2)); }
    .podium-item:nth-child(3) .podium-avatar { width: 58px; height: 58px; font-size: 22px; background: linear-gradient(135deg, #a8a8a8, #dcdcdc); }

    .podium-name { font-size: 14px; font-weight: 800; color: var(--ink); }
    .podium-rating { font-family: 'Fraunces', serif; font-size: 16px; font-weight: 900; }

    .podium-block {
      width: 100%; border-radius: 16px 16px 0 0; display: flex; align-items: center; justify-content: center;
      background: var(--white); border: 1px solid var(--border); border-bottom: none;
    }
    .podium-item:nth-child(1) .podium-block { height: 70px; background: #fffdf5; }
    .podium-item:nth-child(2) .podium-block { height: 110px; background: #fffaf8; border-color: rgba(255,92,53,0.1); }
    .podium-item:nth-child(3) .podium-block { height: 50px; background: #f9f9fb; }
    .podium-rank-num { font-size: 28px; }

    /* List - Light Version */
    .lb-list { background: var(--white); border: 1px solid var(--border); border-radius: var(--rl); overflow: hidden; box-shadow: 0 4px 20px rgba(0,0,0,0.03); }
    .lb-row {
      display: flex; align-items: center; gap: 18px; padding: 20px 28px;
      border-bottom: 1px solid var(--off2); transition: all .2s ease;
      animation: fadeUp .5s ease both;
    }
    .lb-row:last-child { border-bottom: none; }
    .lb-row:hover { background: var(--bg); transform: scale(1.005); }

    @keyframes fadeUp { from { opacity:0; transform: translateY(15px); } to { opacity:1; transform: translateY(0); } }

    .lb-rank { font-family: 'Fraunces', serif; font-size: 22px; font-weight: 900; width: 40px; color: var(--ink3); opacity: 0.5; }
    .lb-avatar {
      width: 44px; height: 44px; border-radius: 12px;
      display: flex; align-items: center; justify-content: center;
      font-weight: 800; font-size: 15px; color: white; flex-shrink: 0;
    }
    .lb-info { flex: 1; }
    .lb-info p { font-size: 16px; font-weight: 800; color: var(--ink); margin-bottom: 2px; }
    .lb-info span { font-size: 13px; color: var(--ink3); font-weight: 500; }

    .lb-rating { text-align: right; }
    .lb-score { font-family: 'Fraunces', serif; font-size: 24px; font-weight: 900; color: var(--ink); line-height: 1; }
    .lb-stars { color: var(--accent2); font-size: 11px; margin-top: 4px; letter-spacing: 1px; }

    .state-box { text-align: center; padding: 80px 24px; color: var(--ink3); }
    .spinner {
      width: 32px; height: 32px; border: 3px solid var(--off2);
      border-top-color: var(--accent); border-radius: 50%;
      animation: spin .8s linear infinite; margin: 0 auto 16px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>

<div class="wrap">
  <a href="../index.html" class="back-link">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><polyline points="15 18 9 12 15 6"/></svg>
    Dashboard
  </a>

  <div class="page-header">
    <h1>🏆 <em>Top</em> Swappers</h1>
    <p>Honoring our community's most dedicated mentors</p>
  </div>

  <div id="podium-wrap"></div>

  <div id="leaderboard-list">
    <div class="state-box">
      <div class="spinner"></div>
      <p>Fetching rankings…</p>
    </div>
  </div>
</div>

<script>
  const avatarColors = [
    'linear-gradient(135deg,#ff5c35,#ffb347)',
    'linear-gradient(135deg,#3b6ef8,#6c63ff)',
    'linear-gradient(135deg,#1cb87e,#3b6ef8)',
    'linear-gradient(135deg,#f59e0b,#ef4444)',
    'linear-gradient(135deg,#8b5cf6,#ec4899)',
  ];

  function initials(name){ return name ? name.split(' ').map(w=>w[0]).join('').toUpperCase().slice(0,2) : '?'; }

  function loadLeaderboard() {
    $.ajax({
      url: "http://localhost:8080/api/v1/user/leaderboard",
      method: "GET",
      headers: { "Authorization": "Bearer " + token },
      success: function(res) {
        if (!res.data || !res.data.length) {
          $("#leaderboard-list").html('<div class="state-box"><p>No data available yet.</p></div>');
          return;
        }

        const data = res.data;

        // Podium Logic
        if (data.length >= 2) {
          const top3 = data.length >= 3 ? [data[1], data[0], data[2]] : [data[1], data[0]];
          const podium = $('<div class="podium"></div>');

          top3.forEach((u, i) => {
            // Find actual rank in original data
            const actualRank = data.findIndex(x => x.userId === u.userId) + 1;
            const medal = actualRank === 1 ? '🥇' : actualRank === 2 ? '🥈' : '🥉';

            podium.append(`
              <div class="podium-item">
                <div class="podium-avatar">${initials(u.userName)}</div>
                <div class="podium-name">${u.userName.split(' ')[0]}</div>
                <div class="podium-rating" style="color:${actualRank===1?'var(--accent)':'var(--ink3)'}">${u.averageRating.toFixed(1)} ⭐</div>
                <div class="podium-block">
                  <span class="podium-rank-num">${medal}</span>
                </div>
              </div>`);
          });
          $("#podium-wrap").html(podium);
        }

        // List Rendering
        const listContainer = $("#leaderboard-list").html('<div class="lb-list" id="lb-inner"></div>');
        data.forEach((u, i) => {
          const stars = '★'.repeat(Math.round(u.averageRating)) + '☆'.repeat(5 - Math.round(u.averageRating));
          const rankDisplay = (i + 1) <= 3 ? (i === 0 ? '🥇' : i === 1 ? '🥈' : '🥉') : (i + 1);

          $("#lb-inner").append(`
            <div class="lb-row" style="animation-delay: ${i * 0.05}s">
              <div class="lb-rank">${rankDisplay}</div>
              <div class="lb-avatar" style="background:${avatarColors[i % avatarColors.length]}">${initials(u.userName)}</div>
              <div class="lb-info">
                <p>${u.userName}</p>
                <span>${u.totalSkills} Active Skills</span>
              </div>
              <div class="lb-rating">
                <div class="lb-score">${u.averageRating.toFixed(1)}</div>
                <div class="lb-stars">${stars}</div>
              </div>
            </div>`);
        });
      },
      error: function(err) {
        if (err.status === 401) window.location.replace("login.html");
        $("#leaderboard-list").html('<div class="state-box"><p>Unable to connect to the server.</p></div>');
      }
    });
  }

  $(document).ready(loadLeaderboard);
</script>
</body>
</html>
